# === Trading System Config ===

universe:
  source: "sp500"          # sp500 | all_us | custom
  custom_tickers_file: "data/custom_universe.txt"  # only used if source: custom

  # --- all_us source: NASDAQ Trader symbol directory (free, no key, no scraping) ---
  nasdaq_listed_url: "https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt"
  other_listed_url: "https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt"
  exchanges: ["N", "A"]    # NYSE, NYSE American. P/Z/V are ARCA/BATS/IEX — ETF venues.
  request_timeout_seconds: 30
  snapshot_dir: "data/symbol_snapshots"   # dated raw copies of each directory fetch

data:
  lookback_days: 730        # 2 years of daily bars for training/feature history
  interval: "1d"
  raw_dir: "data/raw"
  features_file: "data/features_latest.parquet"
  history_file: "data/ohlcv_history.parquet"

backfill:
  period: "20y"                    # yfinance period string for the historical pull
  interval: "1d"
  batch_size: 50                   # tickers per yfinance request
  sleep_between_batches_sec: 1.0   # be a good citizen; Yahoo has no SLA
  retry_attempts: 3                # retries per batch
  retry_backoff_sec: 5             # multiplied by attempt number
  max_ticker_attempts: 3           # give up on a ticker after this many failures
  threads: true                    # yfinance internal concurrency; set false to be gentler

  # --- Yahoo rate limiting. There is no published limit and no Retry-After
  # header, so the safe pace is discovered at runtime rather than configured.
  jitter_frac: 0.3                 # randomize every sleep by +/- this fraction
  throttle_growth: 2.0             # multiplier applied to delays on each throttling signal
  rate_limit_backoff_sec: 60       # first pause after a rate-limited response
  rate_limit_backoff_max_sec: 900  # ceiling on any single pause
  rate_limit_max_strikes: 5        # stop the run after this many throttling signals
  empty_batches_before_stopping: 3 # consecutive empty batches treated as throttling

labeling:
  horizon_days: 5           # swing-trade horizon: label = forward N-day return
  up_threshold_pct: 3.0     # positive label if forward return >= this %

model:
  path: "models/xgb_uptrend.json"
  train_test_split: 0.2
  random_state: 42

risk:
  position_size_usd: 10.0
  max_open_positions: 10
  stop_loss_type: "atr"        # atr | fixed_pct
  stop_loss_atr_multiple: 2.0  # exit if price drops 2x ATR(14) below entry
  stop_loss_fixed_pct: 8.0     # used only if stop_loss_type: fixed_pct
  take_profit_pct: null        # null = no fixed take-profit; exits on stop or score decay

database:
  path: "data/positions.db"                 # trade ledger — position_tracking.py
  market_data_path: "data/market_data.db"   # OHLCV history + features — storage.py

llm:
  provider: "ollama"                     # ollama | openai_compatible
  endpoint: "http://localhost:11434/api/generate"
  model: "llama3.1:8b"                   # change to whatever you run locally
  timeout_seconds: 120
  max_tickers_per_batch: 25              # batch tickers per LLM call to keep prompts small

scoresheet:
  output_file: "data/scoresheet.json"
  top_n: 25                # only send Claude the top N candidates, not the whole universe
