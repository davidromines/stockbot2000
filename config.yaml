# === Trading System Config ===

compute:
  # This VM has 4 vCPUs and shares a fully committed host with another VM.
  # OpenBLAS, OpenMP and XGBoost each take every core unless told otherwise.
  max_threads: 3     # leave one core for the desktop, SSH and interactive work
  nice_level: 10     # batch jobs yield to anything interactive

universe:
  source: "sp500"          # sp500 | all_us | custom
  custom_tickers_file: "data/custom_universe.txt"  # only used if source: custom

  # --- all_us source: NASDAQ Trader symbol directory (free, no key, no scraping) ---
  nasdaq_listed_url: "https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt"
  other_listed_url: "https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt"
  exchanges: ["N", "A", "P", "Z", "V"]   # NYSE, NYSE American, NYSE Arca, Cboe BZX, IEX

  # Instrument types the daily scanner may trade. Everything in the directory is
  # stored and tagged regardless; this only narrows what gets scored and traded.
  # A swing-trading model should not train on leveraged ETFs or thin warrants.
  tradeable_types: ["common_stock"]

  # Types worth computing indicators for. Warrants, rights, units and notes are
  # too thin and erratic for rolling indicators to mean anything.
  feature_types: ["common_stock", "adr", "etf", "closed_end_fund"]
  request_timeout_seconds: 30
  snapshot_dir: "data/symbol_snapshots"   # dated raw copies of each directory fetch

data:
  source: "sqlite"          # sqlite | parquet — parquet is the legacy 18-ticker smoke-test path
  train_start: "2006-01-01"  # ignore pre-2006 history for training; see STRATEGY_LAB windows
  lookback_days: 730        # 2 years of daily bars for training/feature history
  interval: "1d"
  raw_dir: "data/raw"
  features_file: "data/features_latest.parquet"
  history_file: "data/ohlcv_history.parquet"

backfill:
  period: "max"                    # full available history per instrument
  interval: "1d"
  batch_size: 50                   # tickers per yfinance request
  sleep_between_batches_sec: 1.0   # be a good citizen; Yahoo has no SLA
  retry_attempts: 3                # retries per batch
  retry_backoff_sec: 5             # multiplied by attempt number
  max_ticker_attempts: 3           # give up on a ticker after this many failures
  threads: true                    # yfinance internal concurrency; set false to be gentler

  # --- Yahoo rate limiting. There is no published limit and no Retry-After
  # header, so the safe pace is discovered at runtime rather than configured.
  jitter_frac: 0.3                 # randomize every sleep by +/- this fraction
  throttle_growth: 2.0             # multiplier applied to delays on each throttling signal
  rate_limit_backoff_sec: 60       # first pause after a rate-limited response
  rate_limit_backoff_max_sec: 900  # ceiling on any single pause
  rate_limit_max_strikes: 5        # stop the run after this many throttling signals
  empty_batches_before_stopping: 3 # consecutive empty batches treated as throttling

labeling:
  horizon_days: 5           # swing-trade horizon: label = forward N-day return
  up_threshold_pct: 3.0     # positive label if forward return >= this %

model:
  path: "models/xgb_uptrend.json"
  max_train_rows: 6000000   # cap the training set; subsampled in SQL if exceeded
  test_fraction: 0.2                     # last 20% of the TIMELINE held out, not 20% of rows
  split_metadata_path: "models/split.json"  # backtest.py reads this to stay out-of-sample
  random_state: 42

risk:
  position_size_usd: 10.0
  max_open_positions: 10

  # How candidates are chosen each day.
  #   top_n     — rank by score, fill open slots with the best. The system always
  #               wants exactly max_open_positions, so a rank is the right
  #               instrument and it survives the model being recalibrated.
  #   threshold — buy anything at or above min_score. Kept for experiments.
  # A fixed cutoff of 70 was unreachable: the score is a calibrated probability of
  # a ~27%-base-rate event, and the highest seen in 183k out-of-sample rows was 66.
  # Tradeability floors. Without these, top_n selects penny stocks: the top-ranked
  # rows had a median price of $3.32 with 15% under $1, and their 21%-per-trade
  # backtest was sub-$1 volatility rather than skill. Micro-caps are also where
  # survivorship bias bites hardest, since the ones that went to zero are absent
  # from the data entirely.
  min_price: 5.0                 # no sub-$5 names
  min_dollar_volume: 1000000.0   # >= $1M average daily turnover over 20 sessions

  selection_mode: "top_n"
  min_score: null          # optional floor under top_n; null = take the best regardless
  stop_loss_type: "atr"        # atr | fixed_pct
  stop_loss_atr_multiple: 2.0  # exit if price drops 2x ATR(14) below entry
  stop_loss_fixed_pct: 8.0     # used only if stop_loss_type: fixed_pct
  take_profit_pct: null        # null = no fixed take-profit; exits on stop or score decay

database:
  path: "data/positions.db"                 # trade ledger — position_tracking.py
  market_data_path: "data/market_data.db"   # OHLCV history + features — storage.py

llm:
  provider: "ollama"                     # ollama | openai_compatible
  endpoint: "http://localhost:11434/api/generate"
  model: "llama3.1:8b"                   # change to whatever you run locally
  timeout_seconds: 120
  max_tickers_per_batch: 25              # batch tickers per LLM call to keep prompts small

scoresheet:
  max_staleness_days: 5     # skip tickers whose newest bar is older than this (halted/delisted)
  output_file: "data/scoresheet.json"
  top_n: 25                # only send Claude the top N candidates, not the whole universe
